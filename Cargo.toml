[package]
name = "share-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
# GPUI Kit bundles GPUI, the styled component library and the icon assets.
gpui-kit = "=0.8.0"
actix-web = "4"
anyhow = "1.0"
rust-embed = { version = "8.7.2", features = ["include-exclude"] }
rust-i18n = "3.1.5"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
futures = "0.3"
tokio = { version = "1.47", features = ["rt-multi-thread", "sync"] }
sea-orm = { version = "1.1.14", features = ["sqlx-sqlite", "runtime-tokio", "macros"] }
sea-orm-migration = { version = "1.1.14", features = ["sqlx-sqlite", "runtime-tokio"] }
dirs = "6.0"
async-fs = "2.1"
snowflaked = { version = "1.0.3", features = ["sync"] }
infer = "0.19"
mime_guess2 = "2.3"
actix-files = "0.6.6"
qrcode = "0.14"
local-ip-address = "0.6"
image = "0.25"
futures-util = "0.3"
sha2 = "0.10"
chrono = "0.4"
actix-multipart = "0.7"
uds_windows = "1.1"
